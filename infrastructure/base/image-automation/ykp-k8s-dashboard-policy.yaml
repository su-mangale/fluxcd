apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ykp-k8s-dashboard
  namespace: ykp-system
spec:
  imageRepositoryRef:
    name: ykp-k8s-dashboard
  filterTags:
    pattern: '^(?P<timestamp>[0-9]{8}T[0-9]{6}Z)-sha-[0-9a-f]{7,40}$'
    extract: '$timestamp'
  policy:
    alphabetical:
      order: asc
