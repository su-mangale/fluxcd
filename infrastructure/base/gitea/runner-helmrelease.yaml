apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea-actions-runner
  namespace: gitea
spec:
  releaseName: gitea-actions-runner
  targetNamespace: gitea
  chart:
    spec:
      chart: actions
      sourceRef:
        kind: HelmRepository
        name: gitea-charts
        namespace: gitea
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    giteaRootURL: "http://gitea-http.gitea.svc.cluster.local:3000"
    existingSecret: runner-secret
    existingSecretKey: runner-token
