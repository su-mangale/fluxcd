apiVersion: catalog.ykp.io/v1alpha1
kind: PlatformApp
metadata:
  name: gitea
  namespace: ykp-system
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: ykp-platform
spec:
  catalogAppId: gitea
  version: "12.6.0"
  enabled: true
  targetNamespace: gitea
  lifecycle:
    preservePVCsOnDelete: true
    purgeCRDsOnDelete: false
  valuesFrom:
    - kind: ConfigMap
      name: gitea-values
  valuesOverrides:
    ingress:
      enabled: true
      className: cilium
      hosts:
        - host: gitea.localhost
          paths:
            - path: /
              pathType: Prefix
    gitea:
      config:
        server:
          DOMAIN: gitea.localhost
          ROOT_URL: http://gitea.localhost/
        actions:
          ENABLED: true
    persistence:
      enabled: true
      size: 10Gi
  remediation:
    autoRollback: true
    retries: 3
