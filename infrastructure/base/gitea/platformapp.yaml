apiVersion: catalog.ykp.io/v1alpha1
kind: PlatformApp
metadata:
  name: gitea
  namespace: ykp-system
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: ykp-platform
spec:
  catalogAppId: gitea
  version: "10.6.0"
  enabled: true
  targetNamespace: gitea
  lifecycle:
    preservePVCsOnDelete: true
    purgeCRDsOnDelete: false
  valuesFrom:
    - kind: ConfigMap
      name: gitea-values
      valuesKey: values.yaml
  remediation:
    autoRollback: true
    retries: 3
