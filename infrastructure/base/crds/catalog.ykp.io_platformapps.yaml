apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformapps.catalog.ykp.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
    description: "Enterprise GitOps Platform Application definition for YKP platform."
spec:
  group: catalog.ykp.io
  names:
    kind: PlatformApp
    listKind: PlatformAppList
    plural: platformapps
    singular: platformapp
    shortNames:
      - papp
      - papps
      - platapp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Catalog App
          type: string
          jsonPath: .spec.catalogAppId
          description: "Catalog application identifier"
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
          description: "Whether the GitOps reconciliation is active"
        - name: Phase
          type: string
          jsonPath: .status.phase
          description: "Current application deployment phase"
        - name: URL
          type: string
          jsonPath: .status.url
          description: "Discovered Web UI / Dashboard URL"
        - name: Version
          type: string
          jsonPath: .spec.version
          description: "Configured chart / app version"
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "PlatformApp is the Schema for the YKP platform catalog application GitOps operator."
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - catalogAppId
                - enabled
              properties:
                catalogAppId:
                  type: string
                  description: "Identifier of the application from the YKP Catalog (e.g. postgresql, redis, cert-manager, prometheus-operator)"
                version:
                  type: string
                  description: "Target version or chart version"
                  default: "1.0.0"
                enabled:
                  type: boolean
                  description: "Declarative toggle. When true, operator reconciles and deploys; when false, operator suspends"
                  default: true
                targetNamespace:
                  type: string
                  description: "Namespace where the workload should be deployed"
                  default: "default"
                valuesOverrides:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Custom user-supplied Helm/Kustomize values and parameter overrides"
                lifecycle:
                  type: object
                  description: "Enterprise lifecycle protection rules"
                  properties:
                    preservePVCsOnDelete:
                      type: boolean
                      description: "If true, persistent volume claims will be retained when PlatformApp is deleted"
                      default: true
                    purgeCRDsOnDelete:
                      type: boolean
                      description: "If true, associated custom resource definitions will be removed on uninstall"
                      default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "High-level state of the application"
                  enum:
                    - Pending
                    - Installing
                    - Upgrading
                    - Healthy
                    - Degraded
                    - Suspended
                    - Failed
                    - Unknown
                  default: "Pending"
                observedGeneration:
                  type: integer
                  format: int64
                installedVersion:
                  type: string
                  description: "Currently running chart/application version"
                syncedGitCommit:
                  type: string
                  description: "Git commit hash of the catalog base manifest currently applied"
                lastReconciled:
                  type: string
                  format: date-time
                url:
                  type: string
                  description: "Resolved Web UI / Ingress Dashboard URL"
                message:
                  type: string
                  description: "Human readable description of current phase or error"
                endpoints:
                  type: array
                  description: "Connection strings and UI web URLs discovered for this application"
                  items:
                    type: object
                    required:
                      - name
                      - url
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                      type:
                        type: string
                        enum:
                          - internal
                          - external
                          - database
                          - ui
                          - metrics
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
