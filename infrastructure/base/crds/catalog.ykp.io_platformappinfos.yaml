apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformappinfos.catalog.ykp.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
    description: "Glasskube-inspired resolved package metadata definition for YKP Platform Catalog."
spec:
  group: catalog.ykp.io
  names:
    kind: PlatformAppInfo
    listKind: PlatformAppInfoList
    plural: platformappinfos
    singular: platformappinfo
    shortNames:
      - appinfo
      - appinfos
      - painfo
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Catalog App
          type: string
          jsonPath: .spec.catalogAppId
          description: "Catalog application identifier"
        - name: Version
          type: string
          jsonPath: .spec.version
          description: "Package version"
        - name: Phase
          type: string
          jsonPath: .status.phase
          description: "Resolution phase"
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "PlatformAppInfo is the cluster-wide schema for resolved YKP catalog package metadata."
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - catalogAppId
                - version
              properties:
                catalogAppId:
                  type: string
                  description: "Identifier of the application from the YKP Catalog (e.g. cert-manager, prometheus-operator)"
                version:
                  type: string
                  description: "Package version tag"
                displayName:
                  type: string
                description:
                  type: string
                publisher:
                  type: string
                iconUrl:
                  type: string
                repository:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                    chartName:
                      type: string
                valuesSchema:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "JSONSchema defining configurable parameters for form rendering and validation"
                dependencies:
                  type: array
                  description: "Prerequisite packages required by this package"
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      minVersion:
                        type: string
                      optional:
                        type: boolean
                        default: false
                entrypoints:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      serviceName:
                        type: string
                      port:
                        type: integer
                      path:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Resolving
                    - Ready
                    - Failed
                  default: "Resolving"
                resolvedAt:
                  type: string
                  format: date-time
                message:
                  type: string
