apiVersion: v1
kind: ConfigMap
metadata:
  name: macmon-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  macmon-dashboard.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "title": "GPU Usage %",
          "type": "gauge",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_gpu_usage_ratio * 100 or macmon_gpu_active_ratio * 100",
              "legendFormat": "GPU Usage",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "title": "GPU Power Draw (W)",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "orange", "value": 10 },
                  { "color": "red", "value": 30 }
                ]
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_gpu_power_watts",
              "legendFormat": "GPU Power",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "title": "GPU Frequency (MHz)",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "mhz"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_gpu_freq_mhz",
              "legendFormat": "GPU Frequency",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "title": "Apple Neural Engine (ANE) Power (W)",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "purple", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 15 }
                ]
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_ane_power_watts",
              "legendFormat": "ANE Power",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 6 },
          "id": 5,
          "title": "Darwin Load Average (1m)",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 5 },
                  { "color": "red", "value": 10 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "node_load1",
              "legendFormat": "Load 1m",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 6 },
          "id": 6,
          "title": "APFS Storage Used %",
          "type": "gauge",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "(1 - (node_filesystem_free_bytes{mountpoint='/'} / node_filesystem_size_bytes{mountpoint='/'})) * 100",
              "legendFormat": "Storage Usage",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 6 },
          "id": 7,
          "title": "Available Storage (GB)",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "decgbytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "node_filesystem_free_bytes{mountpoint='/'} / 1073741824",
              "legendFormat": "Free Disk Space",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 6 },
          "id": 8,
          "title": "Active RAM (GB)",
          "type": "stat",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "decgbytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "node_memory_active_bytes / 1073741824",
              "legendFormat": "Active RAM",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "id": 9,
          "title": "Apple Silicon Power Consumption Breakdown (W)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "watt"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_sys_power_watts",
              "legendFormat": "Total System Power",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_cpu_power_watts",
              "legendFormat": "CPU Power",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_gpu_power_watts",
              "legendFormat": "GPU Power",
              "refId": "C"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_ram_power_watts",
              "legendFormat": "RAM Power",
              "refId": "D"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "id": 10,
          "title": "CPU & GPU Frequencies (MHz)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "mhz"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_pcpu_freq_mhz",
              "legendFormat": "P-Core Frequency",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_ecpu_freq_mhz",
              "legendFormat": "E-Core Frequency",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "macmon_gpu_freq_mhz",
              "legendFormat": "GPU Frequency",
              "refId": "C"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "id": 11,
          "title": "NVMe Disk I/O Throughput (MB/s)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "Bps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(node_disk_read_bytes_total[1m])",
              "legendFormat": "Disk Read (Bytes/s)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(node_disk_written_bytes_total[1m])",
              "legendFormat": "Disk Write (Bytes/s)",
              "refId": "B"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "id": 12,
          "title": "Network Bandwidth (Bytes/s)",
          "type": "timeseries",
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "Bps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(node_network_receive_bytes_total{device!='lo0'}[1m]))",
              "legendFormat": "Download (RX)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(node_network_transmit_bytes_total{device!='lo0'}[1m]))",
              "legendFormat": "Upload (TX)",
              "refId": "B"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["macmon", "node_exporter", "apple-silicon", "macos"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "macOS Full Observability (Apple Silicon M4 + OS Metrics)",
      "uid": "macmon-apple-silicon-metrics",
      "version": 3
    }
