apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  interval: 5m0s
  chart:
    spec:
      chart: alertmanager
      version: "1.27.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  targetNamespace: monitoring
  values:
    # default values - customize as needed
    replicaCount: 1
    service:
      type: ClusterIP
