apiVersion: v1
kind: Service
metadata:
  name: node-exporter-host-metrics
  namespace: monitoring
  labels:
    app: node-exporter-host-metrics
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: node-exporter-host-metrics
  namespace: monitoring
  labels:
    app: node-exporter-host-metrics
subsets:
  - addresses:
      - ip: 192.168.5.2
    ports:
      - name: metrics
        port: 9100
        protocol: TCP
