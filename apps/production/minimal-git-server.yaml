apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minimal-git-server
  namespace: flux-system
spec:
  targetNamespace: ykp-system
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/minimal-git-server
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: minimal-git-server
      namespace: ykp-system
