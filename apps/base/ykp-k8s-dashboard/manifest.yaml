apiVersion: apps/v1
kind: Deployment
metadata:
  name: ykp-k8s-dashboard
  namespace: ykp-system
  labels:
    app: ykp-k8s-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ykp-k8s-dashboard
  template:
    metadata:
      labels:
        app: ykp-k8s-dashboard
    spec:
      containers:
        - name: k8s-dashboard
          image: ghcr.io/su-mangale/ykp-k8s-dashboard:20260814T033408Z-sha-a963cdf # {"$imagepolicy": "ykp-system:ykp-k8s-dashboard"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: http://ykp-api:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ykp-k8s-dashboard
  namespace: ykp-system
spec:
  selector:
    app: ykp-k8s-dashboard
  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004
