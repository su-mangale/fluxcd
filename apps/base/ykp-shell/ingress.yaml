apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ykp-ingress
  namespace: ykp-system
  annotations:
    kubernetes.io/ingress.class: nginx
    # Keep interactive terminal WebSocket connections alive while idle.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: ykp-api
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: ykp-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ykp-shell
                port:
                  number: 3000
