apiVersion: apps/v1
kind: Deployment
metadata:
  name: ykp-shell
  namespace: ykp-system
  labels:
    app: ykp-shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ykp-shell
  template:
    metadata:
      labels:
        app: ykp-shell
    spec:
      containers:
        - name: shell
          image: ghcr.io/su-mangale/ykp-shell:20260811T022945Z-sha-0b7bba2 # {"$imagepolicy": "ykp-system:ykp-shell"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: http://ykp-api:8080
            # Point routing proxies to internal k8s ClusterIP services
            - name: AUTH_URL
              value: http://ykp-auth:3001
            - name: DASHBOARD_URL
              value: http://ykp-dashboard:3002
            - name: CATALOG_URL
              value: http://ykp-catalog:3003
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ykp-shell
  namespace: ykp-system
spec:
  selector:
    app: ykp-shell
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
