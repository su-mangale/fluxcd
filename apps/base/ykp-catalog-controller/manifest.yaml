apiVersion: v1
kind: ServiceAccount
metadata:
  name: ykp-catalog-controller-sa
  namespace: ykp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ykp-catalog-controller-role
rules:
  - apiGroups: ["catalog.ykp.io"]
    resources: ["platformapps", "platformapps/status", "platformapps/finalizers", "platformappinfos", "platformappinfos/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["helmrepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "services", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ykp-catalog-controller-binding
subjects:
  - kind: ServiceAccount
    name: ykp-catalog-controller-sa
    namespace: ykp-system
roleRef:
  kind: ClusterRole
  name: ykp-catalog-controller-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ykp-catalog-controller
  namespace: ykp-system
  labels:
    app: ykp-catalog-controller
    app.kubernetes.io/part-of: ykp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ykp-catalog-controller
  template:
    metadata:
      labels:
        app: ykp-catalog-controller
    spec:
      serviceAccountName: ykp-catalog-controller-sa
      containers:
        - name: manager
          image: ghcr.io/su-mangale/ykp-catalog-controller:20260901T071022Z-sha-38e4b07 # {"$imagepolicy": "ykp-system:ykp-catalog-controller"}
          imagePullPolicy: Always
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --leader-elect=false
          env:
            - name: YKP_API_URL
              value: "http://ykp-api.ykp-system.svc.cluster.local:8080"
            - name: YKP_CATALOG_REGISTRY_URL
              value: "http://ykp-api.ykp-system.svc.cluster.local:8080/api/catalog"
            - name: YKP_AUDIT_URL
              value: "http://ykp-audit.ykp-system.svc.cluster.local:3005"
            - name: YKP_AUTH_URL
              value: "http://ykp-auth.ykp-system.svc.cluster.local:3001"
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
