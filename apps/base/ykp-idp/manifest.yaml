apiVersion: apps/v1
kind: Deployment
metadata:
  name: ykp-idp
  namespace: ykp-system
  labels:
    app: ykp-idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ykp-idp
  template:
    metadata:
      labels:
        app: ykp-idp
    spec:
      containers:
        - name: idp
          image: ghcr.io/su-mangale/ykp-idp:20260829T161220Z-sha-a51f397 # {"$imagepolicy": "ykp-system:ykp-idp"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3006
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: http://ykp-api:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ykp-idp
  namespace: ykp-system
spec:
  selector:
    app: ykp-idp
  ports:
    - protocol: TCP
      port: 3006
      targetPort: 3006
