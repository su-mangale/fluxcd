apiVersion: v1
kind: ServiceAccount
metadata:
  name: ykp-api-sa
  namespace: ykp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ykp-api-admin-binding
subjects:
  - kind: ServiceAccount
    name: ykp-api-sa
    namespace: ykp-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ykp-api
  namespace: ykp-system
  labels:
    app: ykp-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ykp-api
  template:
    metadata:
      labels:
        app: ykp-api
    spec:
      serviceAccountName: ykp-api-sa
      containers:
        - name: api
          image: ghcr.io/su-mangale/ykp-api:20261008T105324Z-sha-13884fd # {"$imagepolicy": "ykp-system:ykp-api"}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: YKP_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ykp-session-secret
                  key: YKP_SESSION_SECRET
                  optional: true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ykp-api
  namespace: ykp-system
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: ykp-api
