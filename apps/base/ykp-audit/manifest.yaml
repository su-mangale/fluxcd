apiVersion: apps/v1
kind: Deployment
metadata:
  name: ykp-audit
  namespace: ykp-system
  labels:
    app: ykp-audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ykp-audit
  template:
    metadata:
      labels:
        app: ykp-audit
    spec:
      containers:
        - name: audit
          image: ghcr.io/su-mangale/ykp-audit:20260828T060949Z-sha-4ab8040 # {"$imagepolicy": "ykp-system:ykp-audit"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: http://ykp-api:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ykp-audit
  namespace: ykp-system
spec:
  selector:
    app: ykp-audit
  ports:
    - protocol: TCP
      port: 3005
      targetPort: 3005
