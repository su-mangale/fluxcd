apiVersion: v1
kind: ConfigMap
metadata:
  name: git-server-config
data:
  config.yml: |
    external_hostname: ""
    external_port: 22
    accounts:
      - user: gitadmin
        uid: 10001
        keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ0UNQ5Pa3he7c3YyMvvCmloAW96p27jjVlIb5tDMDha lopchanmangal5@gmail.com"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-server-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-git-server
  labels:
    app: minimal-git-server
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for ReadWriteOnce PVC
  selector:
    matchLabels:
      app: minimal-git-server
  template:
    metadata:
      labels:
        app: minimal-git-server
    spec:
      containers:
        - name: git-server
          image: ghcr.io/mcarbonne/minimal-git-server:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 22
          volumeMounts:
            # Persistent repo data
            - name: git-storage
              mountPath: /srv/git
              subPath: git
            # Persistent SSH host keys (auto-generated by container on first boot)
            - name: git-storage
              mountPath: /srv/ssh
              subPath: ssh
            # Server config from ConfigMap
            - name: config-volume
              mountPath: /srv/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: git-storage
          persistentVolumeClaim:
            claimName: git-server-pvc
        - name: config-volume
          configMap:
            name: git-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
spec:
  type: ClusterIP
  selector:
    app: minimal-git-server
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
