# ==============================================================================
# 2. AUTH SERVICE (Port 3001)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ykp-auth
  namespace: ykp-system
  labels:
    app: ykp-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ykp-auth
  template:
    metadata:
      labels:
        app: ykp-auth
    spec:
      containers:
        - name: auth
          image: ghcr.io/su-mangale/ykp-auth:20260807T212959Z-sha-44dd6d3 # {"$imagepolicy": "ykp-system:ykp-auth"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BACKEND_URL
              value: http://ykp-api:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ykp-auth
  namespace: ykp-system
spec:
  selector:
    app: ykp-auth
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
