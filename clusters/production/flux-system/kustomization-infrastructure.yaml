---
# Manage infrastructure/production with Flux
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-production
  namespace: flux-system
spec:
  interval: 10m0s
  path: "./infrastructure/production"
  prune: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
