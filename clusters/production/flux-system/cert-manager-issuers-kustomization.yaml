---
# Reconcile cert-manager issuers only after cert-manager Kustomization succeeded
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m0s
  path: "./infrastructure/production/cert-manager-issuers"
  prune: true
  wait: true
  timeout: 5m0s
  validation: client
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
      namespace: flux-system
