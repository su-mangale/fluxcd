---
# Reconcile cert-manager (HelmRelease) from infrastructure/production/cert-manager
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1m0s
  path: "./infrastructure/production/cert-manager"
  prune: true
  wait: true
  timeout: 15m0s
  # retryInterval sets how often to retry a previously failed reconciliation.
  # Use a duration string (e.g. 1m0s). The older `retry.limit` field is not
  # part of the Kustomization v1 spec returned by `k explain`.
  retryInterval: 1m0s
  validation: client
  sourceRef:
    kind: GitRepository
    name: flux-system
