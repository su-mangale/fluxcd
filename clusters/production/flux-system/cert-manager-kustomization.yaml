---
# Reconcile cert-manager (HelmRelease) from infrastructure/production/cert-manager
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m0s
  path: "./infrastructure/production/cert-manager"
  prune: true
  wait: true
  timeout: 5m0s
  validation: client
  sourceRef:
    kind: GitRepository
    name: flux-system
