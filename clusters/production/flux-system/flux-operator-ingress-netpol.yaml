apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-operator-ingress
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flux-operator
    app.kubernetes.io/part-of: ykp-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9080
          protocol: TCP
