---
# Reconcile fast-api app after Traefik and cert-manager issuers are ready
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fast-api
  namespace: flux-system
spec:
  interval: 5m0s
  path: "../apps/base/fast-api"
  prune: true
  wait: true
  timeout: 10m0s
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: traefik
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: flux-system
