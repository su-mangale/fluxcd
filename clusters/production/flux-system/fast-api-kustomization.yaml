---
# Reconcile fast-api app after Traefik and cert-manager issuers are ready
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fast-api
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./apps/base/fast-api"
  prune: true
  wait: true
  timeout: 10m0s
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: traefik
      namespace: flux-system
    - name: cert-manager-issuers
      namespace: flux-system
  # Health checks to ensure infra is ready before considering the app healthy
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: letsencrypt-prod
    - apiVersion: apps/v1
      kind: Deployment
      name: traefik
      namespace: traefik-ingress
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      current: "object.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      failed: "object.status.conditions.exists(c, c.type == 'Ready' && c.status == 'False')"
    # Certificate readiness check removed to avoid blocking app reconcile while cert-manager issues certs.
    - apiVersion: apps/v1
      kind: Deployment
      current: "object.status.availableReplicas != null && object.status.availableReplicas >= 1"
      inProgress: "object.status.availableReplicas == null || object.status.availableReplicas < 1"
